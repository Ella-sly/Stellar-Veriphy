name: Contract Docs

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/api/**"
      - "docs/INTEGRATION_GUIDE.md"
      - ".github/workflows/contract-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate RustDoc
        run: |
          cargo doc --manifest-path contracts/oracle/Cargo.toml --no-deps
          cargo doc --manifest-path contracts/provenance/Cargo.toml --no-deps
          cargo doc --manifest-path contracts/registry/Cargo.toml --no-deps

      - name: Build Pages artifact
        run: |
          mkdir -p site/api
          cp docs/api/CONTRACTS.md site/index.md
          cp docs/INTEGRATION_GUIDE.md site/integration.md
          cp -R contracts/oracle/target/doc site/api/oracle-rustdoc
          cp -R contracts/provenance/target/doc site/api/provenance-rustdoc
          cp -R contracts/registry/target/doc site/api/registry-rustdoc

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
