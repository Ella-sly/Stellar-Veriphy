name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  RUST_VERSION: stable
  NODE_VERSION: 20
  PNPM_VERSION: 10.18.2

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Frontend — lint, build, unit tests, coverage
  # ──────────────────────────────────────────────────────────────────────────
  frontend-unit-tests:
    name: Frontend Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint frontend
        run: pnpm check:frontend

      - name: Build frontend
        run: pnpm build:frontend

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npx jest --coverage --coverageReporters=text --coverageReporters=lcov --passWithNoTests
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14

      - name: Enforce 80% coverage threshold
        working-directory: frontend
        run: |
          npx jest --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}' --passWithNoTests
        env:
          CI: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Soroban contracts — build, test (unit + integration)
  # ──────────────────────────────────────────────────────────────────────────
  build-contracts:
    name: Build & Test Soroban Contracts (${{ matrix.contract }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        contract: [oracle, provenance, registry]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/${{ matrix.contract }}/target/
          key: ${{ runner.os }}-cargo-${{ matrix.contract }}-${{ hashFiles('contracts/${{ matrix.contract }}/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.contract }}-

      - name: Check Rust formatting
        working-directory: contracts/${{ matrix.contract }}
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: contracts/${{ matrix.contract }}
        run: cargo clippy --target wasm32-unknown-unknown --release -- -D warnings

      - name: Build contract (Wasm)
        working-directory: contracts/${{ matrix.contract }}
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run unit tests
        working-directory: contracts/${{ matrix.contract }}
        run: cargo test --lib -- --test-threads=1

      - name: Run integration tests
        working-directory: contracts/${{ matrix.contract }}
        run: cargo test integration_ -- --test-threads=1 --nocapture
        # Only the oracle crate has integration_ tests; others exit 0 with no matches
        continue-on-error: false

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.contract }}-contract
          path: contracts/${{ matrix.contract }}/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Contract coverage via cargo-llvm-cov
  # ──────────────────────────────────────────────────────────────────────────
  contract-coverage:
    name: Contract Test Coverage (${{ matrix.contract }})
    runs-on: ubuntu-latest
    needs: build-contracts

    strategy:
      fail-fast: false
      matrix:
        contract: [oracle, provenance, registry]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/${{ matrix.contract }}/target/
          key: ${{ runner.os }}-cargo-cov-${{ matrix.contract }}-${{ hashFiles('contracts/${{ matrix.contract }}/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-${{ matrix.contract }}-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --quiet

      - name: Generate coverage report
        working-directory: contracts/${{ matrix.contract }}
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info \
            -- --test-threads=1
        env:
          RUSTFLAGS: ""

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.contract }}-coverage
          path: contracts/${{ matrix.contract }}/lcov.info
          retention-days: 14

      - name: Print coverage summary
        working-directory: contracts/${{ matrix.contract }}
        run: |
          cargo llvm-cov report --summary-only -- --test-threads=1
        env:
          RUSTFLAGS: ""

  # ──────────────────────────────────────────────────────────────────────────
  # 4. E2E tests (Playwright) — runs against a production Next.js build
  # ──────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browser (${{ matrix.browser }})
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build frontend for E2E
        run: pnpm build:frontend
        env:
          NEXT_PUBLIC_MOCK_WALLET: "true"

      - name: Start Next.js server (background)
        working-directory: frontend
        run: |
          NEXT_PUBLIC_MOCK_WALLET=true npx next start --port 3000 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait until the server is accepting connections
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright E2E tests (${{ matrix.browser }})
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Stop Next.js server
        if: always()
        run: kill ${{ env.SERVER_PID }} || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload visual regression snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-${{ matrix.browser }}
          path: frontend/e2e/snapshots/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Mutation testing — verifies test suite quality (packages/shared)
  # ──────────────────────────────────────────────────────────────────────────
  mutation-testing:
    name: Mutation Testing (packages/shared)
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Stryker
        run: pnpm --filter @stellarveriphy/shared run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/shared/reports/mutation
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Final gate — all jobs must pass
  # ──────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - frontend-unit-tests
      - build-contracts
      - contract-coverage
      - e2e-tests

    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-coverage

      - name: List all coverage reports
        run: |
          echo "📊 Coverage reports collected:"
          find all-coverage -name "*.info" -o -name "lcov.info" | sort

      - name: CI gate passed
        run: |
          echo "✅ All CI checks passed:"
          echo "  • Frontend unit tests + 80% coverage threshold"
          echo "  • Oracle contract: unit + integration tests + coverage"
          echo "  • Provenance contract: unit tests + coverage"
          echo "  • Registry contract: unit tests + coverage"
          echo "  • E2E tests on Chromium, Firefox, WebKit"
